context:
  version: "0.2.1"
  python_min: "3.11"

package:
  name: spaday-webawesome
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-webawesome/spaday_webawesome-${{ version }}.tar.gz
  sha256: 4b2c826c57d7bf40115673fabd69dc0ab325feed784007e1f3eb05fb13bc0a64

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - pydantic >=2
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_webawesome
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Typed WebAwesome components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-webawesome
  repository: https://github.com/1kbgz/spaday-webawesome

extra:
  recipe-maintainers:
    - timkpaine
